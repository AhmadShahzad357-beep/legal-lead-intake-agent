<svg width="100%" viewBox="0 0 1045 710" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hub-and-spoke architecture diagram with agent.py at the center">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
<linearGradient id="grayg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3038"/><stop offset="1" stop-color="#1c2128"/></linearGradient>
<radialGradient id="purpleg"><stop offset="0" stop-color="#4b2f80"/><stop offset="1" stop-color="#2d1f47"/></radialGradient>
<linearGradient id="tealg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12433d"/><stop offset="1" stop-color="#0d3330"/></linearGradient>
<linearGradient id="coralg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2626"/><stop offset="1" stop-color="#3a1f1f"/></linearGradient>
<filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#8957e5" flood-opacity="0.55"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
  .th { fill:#f0f6fc; font: 600 15px -apple-system,Segoe UI,Roboto,sans-serif; }
  .ts { fill:#8b949e; font: 11.5px -apple-system,Segoe UI,Roboto,sans-serif; }
  .arr { stroke:#58a6ff; stroke-width:1.8; fill:none; }
  .flow { stroke-dasharray:5 7; }
  .particle { opacity:0; }
  @media (prefers-reduced-motion: no-preference) {
    .flow { animation: flowmove 1.1s linear infinite; }
    .particle { opacity:1; }
  }
  @keyframes flowmove { to { stroke-dashoffset: -24; } }
</style>

<rect x="0" y="0" width="1045" height="710" rx="22" fill="url(#bg)"/>
<text x="522" y="34" text-anchor="middle" class="th" font-size="19">Legal Lead Intake — Agent Architecture</text>
<text x="522" y="52" text-anchor="middle" class="ts">agent.py sits at the center and decides everything downstream</text>

<g filter="url(#shadow)"><rect x="40" y="353" width="170" height="54" rx="12" fill="url(#grayg)" stroke="#30363d"/></g>
<text x="60" y="376" class="th" font-size="16">📩</text>
<text x="125" y="374" text-anchor="middle" class="th" font-size="13">New lead</text>
<text x="125" y="391" text-anchor="middle" class="ts">Website · call · LSA</text>

<path d="M210,380 L223,380" class="arr flow" marker-end="url(#arrow)"/>
<circle r="3" fill="#58a6ff" class="particle"><animateMotion dur="1.2s" repeatCount="indefinite" path="M210,380 L223,380"/></circle>

<g filter="url(#shadow)"><rect x="225" y="353" width="170" height="54" rx="12" fill="url(#grayg)" stroke="#30363d"/></g>
<text x="245" y="376" class="th" font-size="16">🔐</text>
<text x="310" y="374" text-anchor="middle" class="th" font-size="13">app.py</text>
<text x="310" y="391" text-anchor="middle" class="ts">Webhook · checks secret</text>

<path d="M395,380 L413,380" class="arr flow" marker-end="url(#arrow)"/>
<circle r="3" fill="#58a6ff" class="particle"><animateMotion dur="1.2s" repeatCount="indefinite" path="M395,380 L413,380"/></circle>

<g filter="url(#glow)"><rect x="415" y="295" width="170" height="170" rx="30" fill="url(#purpleg)" stroke="#8957e5" stroke-width="1.4"/></g>
<text x="500" y="352" text-anchor="middle" font-size="26">🧠</text>
<text x="500" y="386" text-anchor="middle" class="th">agent.py</text>
<text x="500" y="404" text-anchor="middle" class="ts">LLM tool-calling</text>
<text x="500" y="418" text-anchor="middle" class="ts">loop</text>
<text x="500" y="440" text-anchor="middle" class="ts" font-size="10.5">↻ reads each result,</text>
<text x="500" y="453" text-anchor="middle" class="ts" font-size="10.5">picks the next tool</text>

<path d="M500,295 L500,252" class="arr flow" marker-end="url(#arrow)"/>
<circle r="3" fill="#8957e5" class="particle"><animateMotion dur="1.4s" repeatCount="indefinite" path="M500,295 L500,252"/></circle>
<path d="M585,380 L623,380" class="arr flow" marker-end="url(#arrow)"/>
<circle r="3" fill="#8957e5" class="particle"><animateMotion dur="1.4s" repeatCount="indefinite" path="M585,380 L623,380"/></circle>
<path d="M500,465 L500,508" class="arr flow" marker-end="url(#arrow)"/>
<circle r="3" fill="#8957e5" class="particle"><animateMotion dur="1.4s" repeatCount="indefinite" path="M500,465 L500,508"/></circle>

<g filter="url(#shadow)"><rect x="415" y="190" width="170" height="60" rx="12" fill="url(#tealg)" stroke="#2ea597"/></g>
<text x="435" y="212" font-size="14">🗂️</text>
<text x="500" y="216" text-anchor="middle" class="th" font-size="13">Save to CRM</text>
<text x="500" y="233" text-anchor="middle" class="ts">crm.py</text>

<g filter="url(#shadow)"><rect x="625" y="350" width="170" height="60" rx="12" fill="url(#tealg)" stroke="#2ea597"/></g>
<text x="645" y="373" font-size="14">🔔</text>
<text x="710" y="376" text-anchor="middle" class="th" font-size="13">Notify team</text>
<text x="710" y="393" text-anchor="middle" class="ts">notifier.py</text>

<g filter="url(#shadow)"><rect x="415" y="510" width="170" height="60" rx="12" fill="url(#tealg)" stroke="#2ea597"/></g>
<text x="435" y="533" font-size="14">💬</text>
<text x="500" y="536" text-anchor="middle" class="th" font-size="13">Auto-reply</text>
<text x="500" y="553" text-anchor="middle" class="ts">responder.py</text>

<path d="M500,190 L500,152" class="arr flow" marker-end="url(#arrow)"/>
<circle r="3" fill="#f0883e" class="particle"><animateMotion dur="1.3s" repeatCount="indefinite" path="M500,190 L500,152"/></circle>
<path d="M795,380 L833,380" class="arr flow" marker-end="url(#arrow)"/>
<circle r="3" fill="#f0883e" class="particle"><animateMotion dur="1.3s" repeatCount="indefinite" path="M795,380 L833,380"/></circle>
<path d="M500,570 L500,608" class="arr flow" marker-end="url(#arrow)"/>
<circle r="3" fill="#f0883e" class="particle"><animateMotion dur="1.3s" repeatCount="indefinite" path="M500,570 L500,608"/></circle>

<g filter="url(#shadow)"><rect x="415" y="90" width="170" height="60" rx="12" fill="url(#coralg)" stroke="#f0883e"/></g>
<text x="435" y="113" font-size="14">📇</text>
<text x="500" y="116" text-anchor="middle" class="th" font-size="13">HubSpot</text>
<text x="500" y="133" text-anchor="middle" class="ts">Contact saved</text>

<g filter="url(#shadow)"><rect x="835" y="350" width="170" height="60" rx="12" fill="url(#coralg)" stroke="#f0883e"/></g>
<text x="855" y="373" font-size="14">#️⃣</text>
<text x="920" y="376" text-anchor="middle" class="th" font-size="13">Slack</text>
<text x="920" y="393" text-anchor="middle" class="ts">Team alerted</text>

<g filter="url(#shadow)"><rect x="415" y="610" width="170" height="60" rx="12" fill="url(#coralg)" stroke="#f0883e"/></g>
<text x="435" y="633" font-size="14">✅</text>
<text x="500" y="636" text-anchor="middle" class="th" font-size="13">WhatsApp</text>
<text x="500" y="653" text-anchor="middle" class="ts">Prospect notified</text>

<circle cx="800" cy="150" r="5" fill="#4b5158"/><text x="812" y="154" class="ts">Entry</text>
<circle cx="870" cy="150" r="5" fill="#8957e5"/><text x="882" y="154" class="ts">AI decision</text>
<circle cx="800" cy="172" r="5" fill="#2ea597"/><text x="812" y="176" class="ts">Actions</text>
<circle cx="870" cy="172" r="5" fill="#f0883e"/><text x="882" y="176" class="ts">External services</text>
</svg>
